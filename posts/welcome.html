<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to My Parchment - Parchment</title>
  <link rel="stylesheet" href="../style.css">

  <!-- Font Awesome CDN for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>
<body data-page="{{PAGE}}">
  <!-- ===========================
       Header Section
       =========================== -->
  <header>
    <h1>Parchment</h1>
    <nav>
      <!-- Back link dynamically updated via JS -->
      <a id="back-link" class="back-link" href="../index.html">← Back to Page</a>
    </nav>
  </header>

  <!-- ===========================
       Main Post Content
       =========================== -->
  <main>
    <!-- Featured image for the post -->
    <div class="post-featured-post">
      <img src="images/welcome.jpg" alt="Welcome to My Parchment">
    </div>

    <!-- Article content -->
    <article>
      <h2>Welcome to My Parchment</h2>
      <p id="post-date"><em>August 20, 2025</em></p>

      <h4></h4>
      <p>This is my very first post on <strong>Parchment</strong>! I’ll share thoughts, travels, baking, and experiences from my life inside and outside academia.</p>

      <p></p>
    </article>

    <!-- Duplicate back link at the bottom for convenience -->
    <p><a id="back-link-bottom" class="back-link" href="../index.html">← Back to Page</a></p>
  </main>

  <!-- ===========================
       Footer Section
       =========================== -->
  <footer>
    <p>
      <a href="../about.html">About Me</a> |
      <span class="social-icons">
        <a href="https://github.com/besener" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://instagram.com/bihter.esener" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://flickr.com/besener" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-flickr"></i>
        </a>
        <a href="https://bsky.app/profile/besener.bsky.social" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-bluesky"></i>
        </a>
      </span>
    </p>
    <p>© 2025 Parchment</p>
  </footer>

  <!-- ===========================
       JavaScript Section
       Dynamic back links + safe date display
       =========================== -->
  <script>
    // ===========================
    // 1. Get ?page=N if present
    // ===========================
    const urlParams = new URLSearchParams(window.location.search);
    let page = parseInt(urlParams.get('page'));

    if (!page || page <= 0) {
    // ===========================
    // 2. If no ?page=N, fetch posts.json and compute it
    // ===========================
    fetch("../posts.json")
        .then(res => res.json())
        .then(posts => {
          // Sort newest first
          posts = posts.sort((a,b) => new Date(b.date + "T00:00:00") - new Date(a.date + "T00:00:00"));

          // Get current file name
          const pathParts = window.location.pathname.split("/");
          const fileName = pathParts[pathParts.length - 1]; // e.g., "welcome.html"

          // Find its index
          const postIndex = posts.findIndex(p => p.file === fileName);

          if (postIndex !== -1) {
            page = Math.floor(postIndex / POSTS_PER_PAGE) + 1;
          } else {
            page = 1; // fallback if not found
          }

          updateBackLinks(page);
        })
        .catch(() => updateBackLinks(1)); // fallback if posts.json fails
    } else {
      updateBackLinks(page);
    }

    // ===========================
    // 3. Update all back links
    // ===========================
    function updateBackLinks(page) {
      const backLinks = document.querySelectorAll('#back-link, #back-link-bottom');
      backLinks.forEach(link => {
        link.href = `../index.html?page=${page}`;
        link.textContent = `← Back to Page ${page}`;
      });
    }
    
    // ===========================
    // 4. Timezone-safe date display
    // ===========================
    const postDateEl = document.getElementById('post-date');
    if(postDateEl){
      const isoDateStr = postDateEl.textContent.trim(); // e.g., "2025-08-20"

      // Only process if the date looks valid
      if (/^\d{4}-\d{2}-\d{2}$/.test(isoDateStr)) {
        // Add T00:00:00 to force UTC parsing (prevents timezone shifts)
        const dateObj = new Date(isoDateStr + "T00:00:00");

        // Format nicely for display
        postDateEl.textContent = dateObj.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      }
    }
  </script>
</body>
</html>
