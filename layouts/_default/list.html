<!--
layouts/_default/list.html
Fully annotated paginated post list template.
Includes:
- Post titles with class="post-link" (required for JS redirect)
- Post featured images (optional)
- Post summaries
- Formatted post dates
- Pagination controls
- Footer
- JS redirect for bookmarked posts
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts - Parchment</title>
  <!-- Link your global stylesheet -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header>
    <h1>Posts</h1>
  </header>

  <main>
    <!-- --- Render paginated posts --- -->
    {{ range .Paginator.Pages }}
      <article class="post-card">
        <!-- Post featured image (optional) -->
        {{ with .Params.featured_image }}
          <img src="{{ . }}" alt="{{ $.Title }}" class="post-image">
        {{ end }}

        <!-- Post title -->
        <h2>
          <a class="post-link" href="{{ .Permalink }}">{{ .Title }}</a>
        </h2>

        <!-- Formatted post date -->
        <p class="post-date">{{ .Date.Format "Jan 2, 2006" }}</p>

        <!-- Post summary/excerpt -->
        <p class="post-summary">{{ .Summary }}</p>
      </article>
    {{ end }}

    <!-- --- Pagination Controls --- -->
    <nav class="pagination">
      {{ if .Paginator.HasPrev }}
        <a href="{{ .Paginator.Prev.URL }}" class="prev-page">Previous</a>
      {{ end }}
      {{ if .Paginator.HasNext }}
        <a href="{{ .Paginator.Next.URL }}" class="next-page">Next</a>
      {{ end }}
    </nav>
  </main>

  <footer>
    <p>&copy; 2025 My Parchment</p>
  </footer>

  <!-- --- Include the JS redirect for paginated bookmarks --- -->
  <script src="/assets/js/pagination-redirect.js"></script>

</body>
</html>
